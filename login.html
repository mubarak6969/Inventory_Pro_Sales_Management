<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | Inventory Pro</title>

<!-- Google OAuth 2.0 SDK -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#08090d;
  --card:rgba(255,255,255,.07);
  --text:#f5f7fb;
  --muted:#969baa;
  --line:rgba(255,255,255,.1);
  --accent:#7c5cff;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 20%,#24175c 0,transparent 35%),
    radial-gradient(circle at 80% 80%,#063d48 0,transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:Inter,Segoe UI,Arial,sans-serif;
  display:grid;
  place-items:center;
  overflow:hidden;
}

body::before{
  content:"";
  position:fixed;
  width:420px;height:420px;
  border-radius:50%;
  background:#7c5cff33;
  filter:blur(100px);
  top:-120px;right:-100px;
}

.card{
  width:min(430px,92%);
  padding:38px;
  border:1px solid var(--line);
  background:var(--card);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-radius:28px;
  box-shadow:0 30px 80px #0008;
}

.logo{
  width:52px;height:52px;
  border-radius:16px;
  background:linear-gradient(135deg,#8d72ff,#4f3ccf);
  display:grid;place-items:center;
  font-size:24px;font-weight:800;
  margin-bottom:25px;
  box-shadow:0 10px 30px #7c5cff55;
}

h1{font-size:30px;letter-spacing:-1px;margin-bottom:8px}
.sub{color:var(--muted);margin-bottom:30px}

label{display:block;font-size:13px;font-weight:600;margin:18px 0 8px}

input{
  width:100%;padding:14px 15px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#ffffff08;
  color:white;outline:none;
  font-size:15px;transition:.2s;
}
input:focus{border-color:#8d72ff;box-shadow:0 0 0 4px #7c5cff18}

/* ── Primary sign-in button ── */
button[type="submit"]{
  width:100%;border:0;padding:15px;
  border-radius:14px;margin-top:25px;
  background:linear-gradient(135deg,#8d72ff,#6048e8);
  color:white;font-size:15px;font-weight:700;
  cursor:pointer;transition:.2s;
}
button[type="submit"]:hover{transform:translateY(-2px);box-shadow:0 12px 30px #7c5cff44}

/* ── Divider ── */
.divider{
  display:flex;align-items:center;gap:12px;
  margin:22px 0;color:var(--muted);font-size:12px;
}
.divider::before,.divider::after{
  content:"";flex:1;
  border-top:1px solid var(--line);
}

/* ── Google button ── */
.btn-google{
  width:100%;display:flex;align-items:center;
  justify-content:center;gap:10px;
  padding:13px 15px;border-radius:14px;
  border:1px solid var(--line);
  background:#ffffff0a;
  color:var(--text);font-size:14px;font-weight:600;
  cursor:pointer;transition:.2s;
}
.btn-google:hover{background:#ffffff14;border-color:#8d72ff66;transform:translateY(-1px)}
.btn-google svg{flex-shrink:0}

.status{text-align:center;color:#ff7d7d;font-size:13px;margin-top:14px;min-height:18px}
.footer{text-align:center;color:#6f7480;font-size:12px;margin-top:25px}
</style>
</head>

<body>
<main class="card">
  <div class="logo">I</div>

  <h1>Welcome back</h1>
  <p class="sub">Inventory &amp; Sales Management</p>

  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="admin@shop.com" required>

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••" required>

    <button type="submit">Sign in →</button>
    <p class="status" id="status" role="alert"></p>
  </form>

  <div class="divider">or continue with</div>

  <!-- Google One Tap render target -->
  <div id="g_id_onload"
       data-client_id="110852639629-9i2utcm6kdk5vlr2j015ivpq2vq9c479.apps.googleusercontent.com"
       data-callback="handleGoogleLogin"
       data-auto_prompt="false">
  </div>

  <button class="btn-google" onclick="triggerGoogleLogin()">
    <!-- Official Google "G" icon (SVG, royalty-free) -->
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
      <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
      <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
      <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.962L3.964 6.294C4.672 4.169 6.656 3.58 9 3.58z"/>
    </svg>
    Sign in with Google
  </button>

  <div class="footer">Secure business workspace</div>
</main>

<script>
/* ── Helpers ── */
const $  = id => document.getElementById(id);
const setStatus = msg => $("status").textContent = msg;

const saveUser = user => localStorage.setItem("inventory_user", JSON.stringify(user));

/* ── Email / Password login ── */
$("loginForm").addEventListener("submit", e => {
  e.preventDefault();
  const email    = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) { setStatus("Enter your login details."); return; }

  /*
   * TODO: replace with real backend call, e.g.:
   *   const res = await fetch("/api/login", { method:"POST", body: JSON.stringify({email,password}) });
   *   const { token, role } = await res.json();
   */
  saveUser({ email, role: "ADMIN", provider: "email" });
  window.location.href = "index.html";
});

/* ── Google OAuth 2.0 ── */
function handleGoogleLogin(response) {
  /*
   * `response.credential` is a signed JWT (ID token).
   * REQUIRED BACKEND STEP:
   *   POST /api/auth/google  { idToken: response.credential }
   *   → verify with Google's tokeninfo endpoint or a library (e.g. google-auth-library)
   *   → return your own session token + user role
   *
   * Frontend-only stub below (swap out for real fetch):
   */
  const payload = JSON.parse(atob(response.credential.split(".")[1]));
  saveUser({ email: payload.email, name: payload.name, avatar: payload.picture, role: "ADMIN", provider: "google" });
  window.location.href = "index.html";
}

function triggerGoogleLogin() {
  if (typeof google === "undefined") { setStatus("Google SDK not loaded. Check your network."); return; }
  google.accounts.id.prompt(notification => {
    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
      /* Fallback: redirect-based OAuth flow */
      const params = new URLSearchParams({
        client_id:     "110852639629-9i2utcm6kdk5vlr2j015ivpq2vq9c479.apps.googleusercontent.com",
        redirect_uri:  `${location.origin}/api/auth/google/callback`,
        response_type: "code",
        scope:         "openid email profile",
        prompt:        "select_account",
      });
      window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
    }
  });
}
</script>
</body>
</html>
